name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '.github/workflows/docker-build-push.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/traffic-monitoring:${{ github.sha }} ./app

      - name: Tag image as latest
        run: docker tag ${{ secrets.DOCKERHUB_USERNAME }}/traffic-monitoring:${{ github.sha }}
         ${{ secrets.DOCKERHUB_USERNAME }}/traffic-monitoring:latest

      - name: Push images to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/traffic-monitoring:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/traffic-monitoring:latest